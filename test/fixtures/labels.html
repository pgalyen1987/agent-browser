<!doctype html><html><head><title>Labels</title></head><body>
<main>
<h1>Labels</h1>

<!-- aria-labelledby pointing at an id that is not on the page (a typo, or a node that was
     conditionally rendered and then removed). The accessible name must fall back to the button's
     own visible text, not vanish and leave a control an agent cannot name or click. -->
<button aria-labelledby="ghost-heading">Save changes</button>

<!-- aria-labelledby that DOES resolve: the referenced text wins over the button's own "X",
     proving the fall-through only triggers when the reference resolves to nothing. -->
<span id="pay-label">Pay the invoice</span>
<button aria-labelledby="pay-label">X</button>

<!-- A <label for> that exists but is empty. Same shape: fall back to the field's own placeholder
     instead of returning the empty label text. -->
<label for="email-field"></label>
<input id="email-field" type="email" placeholder="Work email">
</main>
</body></html>
